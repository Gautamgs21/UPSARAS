function act(a,id){

 if(a==='edit')return edit(id);
 if(a==='hide')m.h=!m.h;

 else{
  const below=a==='below',prev=L[k-1],next=L[k+1];let lv=m.lv,st=m.st,sib=null;
  if(m.t==='head'){if(below){lv=Math.min(m.lv+1,5);st=m.st==='a'?'N':'i';sib=next}}
  else if(m.t==='calc'){
   if(below){st=m.st==='fx'?'n':'i';if(m.st==='fx')lv=1}
   else if(prev&&(prev.t==='in'||prev.t==='lnk')){lv=prev.lv;st=prev.st;sib=prev}
   else st='i'}
  else sib=m;
  nr={id:'u'+(++S.uid),l:'New particular',lv,st,t:'in'};
  if(sib&&(sib.t==='in'||sib.t==='lnk')){if(sib.s)nr.s=sib.s;if(sib.t==='in'&&sib.aa)nr.aa=true}
  L.splice(below?k+1:k,0,nr);
 }
 save();mRender();if(nr)edit(nr.id);
}

/* CSV */
function parseCSV(t){const R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const h=t[i];
  if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}
  else if(h==='"')q=true;
  else if(h===','||h===';'||h==='\t'){r.push(c);c=''}
  else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);R.push(r);r=[];c=''}
  else c+=h}
 if(c||r.length){r.push(c);R.push(r)}return R.filter(r=>r.some(x=>x.trim()))}
const cnum=x=>{x=String(x||'').trim().replace(/[₹\s,]/g,'').replace('−','-');if(!x||x==='-')return '';const n=/^\(.*\)$/.test(x)?-parseFloat(x.slice(1,-1)):parseFloat(x);return isFinite(n)?String(n):''};
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function importCSV(text){
 const R=parseCSV(text.replace(/^\uFEFF/,''));if(R.length<2){msg='CSV is empty.';return mRender()}
 const hd=R[0].map(x=>x.trim().toLowerCase()),fc=re=>hd.findIndex(h=>re.test(h));
 const ci=fc(/^(row|id|row ?no\.?|excel row)$/),cp=fc(/particular|description|item/),qs=[1,2,3,4].map(n=>fc(new RegExp('^q'+n)));
 if(qs.some(x=>x<0)||(ci<0&&cp<0)){msg='CSV needs a header row with Q1, Q2, Q3, Q4 and Row or Particulars.';return mRender()}
 const metaRows=R.slice(1).filter(r=>/^@/.test(String(r[ci>=0?ci:0]||'').trim())),mv={};let nmeta=0,ndot=0;
 metaRows.forEach(r=>{const k=String(r[ci>=0?ci:0]).trim().slice(1);mv[k]=r;});
 if(mv.model){try{const mm=JSON.parse(mv.model[qs[0]]||'');if(Array.isArray(mm)&&mm.length)S.model=mm;idx()}catch(e){}}
 ['lic','fy','type','lsa','no','mode','date','sorType','sorDateName','sorDate','subtitle'].forEach(k=>{if(mv[k]!==undefined){S.info[k]=String(mv[k][qs[0]]||'').trim();nmeta++}});
 if(mv.svc!==undefined){const a=String(mv.svc[qs[0]]||'').split('|').map(x=>x.trim());S.info.svc=SVC.filter(x=>a.includes(x));nmeta++}
 if(mv.agrApp!==undefined){S.info.agrApp=/^(yes|true|1)$/i.test(String(mv.agrApp[qs[0]]||'').trim());nmeta++}
 if(!S.info.subtitle)S.info.subtitle=DEF_SUB;if(!S.info.date)S.info.date=todayISO();
 Object.keys(mv).filter(k=>/^dot\d+$/.test(k)).forEach(k=>{S.dot[k.slice(3)]=qs.map(i=>cnum(mv[k][i]));ndot++});
 const inp=M().filter(m=>m.t==='in'),used=new Set();let p=0,rows=0,cells=0,miss=[];
 R.slice(1).forEach(r=>{
  if(/^@/.test(String(r[ci>=0?ci:0]||'').trim()))return;
  let m=null;const rid=ci>=0?String(r[ci]||'').trim().replace(/^r/i,''):'';
  if(rid&&byId[rid]&&byId[rid].t==='in')m=byId[rid];
  else if(cp>=0&&r[cp]){const n=norm(r[cp]);let k=inp.findIndex((x,j)=>j>=p&&!used.has(x.id)&&norm(x.l)===n);
   if(k<0)k=inp.findIndex(x=>!used.has(x.id)&&norm(x.l)===n);if(k>=0){m=inp[k];p=k+1}}
  if(!m){if((r[cp]||rid)&&qs.some(i=>cnum(r[i])!==''))miss.push(r[cp]||rid);return}
  used.add(m.id);const v=qs.map(i=>cnum(r[i]));S.sor[m.id]=v;rows++;cells+=v.filter(x=>x!=='').length});
 save();setSub();render();msg=(nmeta?`Basic details loaded${ndot?' + DoT inputs':''}. `:'')+`CSV: filled ${rows} rows (${cells} values)`+(miss.length?`; ${miss.length} not matched: ${miss.slice(0,3).join(', ')}${miss.length>3?'…':''}`:'.');mRender();
}
function exportCSV(){
 if(!needFields())return;
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"',I=S.info;
 let c='Row,Particulars,Q1,Q2,Q3,Q4\n';
 [['lic','Licensee Name',I.lic],['fy','Financial Year',I.fy],['type','License Type / Authorization',I.type],['svc','Service',(I.svc||[]).join('|')],['lsa','License Service Area',I.lsa],['no','License Number',I.no],['mode','Type of Assessment',I.mode],['date','Date of Assessment',I.date],['sorType','Statement of Revenue Type',I.sorType],['sorDateName','SoR Date Field Name',I.sorDateName],['sorDate','SoR Date',I.sorDate],['subtitle','Sub-title',I.subtitle||DEF_SUB],['agrApp','AGR calculated on applicable AGR',I.agrApp?'Yes':'No']]
  .forEach(a=>{c+=['@'+a[0],q(a[1]),q(a[2]||''),'','',''].join(',')+'\n'});
 const DN={59:'DoT - Additions by DoT',60:'DoT - Special Audit',61:'DoT - CAG',67:'DoT - Any other (additions)',63:'Disallowed - PSTN',64:'Disallowed - Roaming',65:'Disallowed - Bad Debts',68:'Disallowed - Any other'};
 Object.keys(S.dot).forEach(k=>{const v=S.dot[k]||[];if(v.some(x=>String(x||'').trim()!==''))c+=['@dot'+k,q(DN[k]||('DoT input '+k)),...[0,1,2,3].map(i=>v[i]||'')].join(',')+'\n'});
 try{if(JSON.stringify(S.model)!==JSON.stringify(DEF))c+=['@model',q('Row structure (do not edit)'),q(JSON.stringify(S.model)),'','',''].join(',')+'\n'}catch(e){}
 M().filter(m=>m.t==='in').forEach(m=>{const v=S.sor[m.id]||[];c+=[m.id,q(m.l),...[0,1,2,3].map(i=>v[i]||'')].join(',')+'\n'});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='Statement_of_Revenue_'+(I.fy||'data')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
